name: Build docker images
on:
  push:
    paths:
      - 'instructor-client/**'
      - 'server/**'
      - 'cicd/**'
      - 'nginx/**'
    branches:
      - main
      - develop
  workflow_dispatch:
jobs:
  build-server-image:
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/src/main/docker/Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/franklyn-server:3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-instructor-client-image:
    permissions: write-all
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '21'
          cache: 'npm'
          cache-dependency-path: 'instructor-client/package-lock.json'

      - name: Build instructor-client
        run: |
          ./cicd/build-instructor-client.sh

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./instructor-client/docker/Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/franklyn-instructor-client:3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max